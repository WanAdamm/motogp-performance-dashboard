[project]
name = "motogp-performance-analytics"
version = "0.1.0"
description = "Coordinate-aware MotoGP timing PDF analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2",
    "httpx>=0.28",
    "pandas>=2.2",
    "pandera[pandas]>=0.24",
    "plotly>=6.0",
    "pyarrow>=19.0",
    "pymupdf>=1.25",
    "streamlit>=1.51",
]

[project.scripts]
motogp-analytics = "motogp_analytics.core:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motogp_analytics", "dashboard"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
